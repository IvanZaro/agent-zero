# Triggered on push to main / version tags. Builds image, pushes to GHCR,
# SSH-deploys to VPS. See plan section 3 (.claude/plans/agent-zero-full-stack-drifting-frog.md).
#
# Required GitHub Secrets:
#   VPS_HOST     - VPS hostname or IP
#   VPS_USER     - SSH user on the VPS
#   VPS_SSH_KEY  - Deploy-only private SSH key (NOT Ivan's personal key)

name: build-and-deploy

on:
  push:
    branches: [main]
    tags:    ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          # Build context = docker/run/ because Dockerfile uses `COPY ./fs/ /`
          # expecting fs/ to be a sibling of the Dockerfile.
          context: docker/run
          file: docker/run/Dockerfile
          platforms: linux/amd64
          push: true
          # BRANCH is required by Dockerfile (gates install_A0.sh clone).
          # GITHUB_REF_NAME is the branch on push events.
          build-args: |
            BRANCH=${{ github.ref_name }}
          tags: |
            ghcr.io/ivanzaro/agent-zero:${{ steps.meta.outputs.tag }}
            ghcr.io/ivanzaro/agent-zero:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # TODO: pin to SHA. Using @v1 floating tag for now; consider replacing with
      # a commit SHA pin (e.g. appleboy/ssh-action@<sha>) for supply-chain hardening.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:  ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/agent-zero
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build.outputs.tag }}|" .env
            docker compose pull agent-zero
            # `up -d` is idempotent: brings up missing services on first deploy,
            # recreates only services whose config/image changed on hot updates.
            # Rollback: SSH in, set IMAGE_TAG=main-<old-sha> in .env, run `up -d`.
            docker compose up -d

            # Use Docker's container healthcheck (already targets /api/health) instead
            # of curl-from-host. More reliable: doesn't depend on Caddy cert state and
            # tolerates the LE issuance window on first deploy.
            ok=0
            for i in $(seq 1 18); do
              health=$(docker inspect agent-zero --format '{{.State.Health.Status}}' 2>/dev/null || echo missing)
              if [ "$health" = "healthy" ]; then
                echo "agent-zero healthy after attempt $i"
                ok=1
                break
              fi
              echo "attempt $i: agent-zero=$health (waiting 10s)"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "HEALTHCHECK FAIL after 18 attempts (~3 min)"
              docker compose ps
              docker logs --tail 50 agent-zero
              exit 1
            fi
